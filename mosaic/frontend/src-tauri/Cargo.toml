[package]
name = "mosaic"
version = "1.0.0"
description = "MOSAIC - Universal Data Transformer desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["shell-open"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "mosaic"
path = "src/main.rs"
